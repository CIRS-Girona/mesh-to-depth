# --- Input Files ---
mesh_path: temp/Agisoft/mesh/mesh.ply              # Accepts .obj, .ply, .stl
cameras_path: temp/Agisoft/cameras.xml             # Camera info file path
camera_format: agisoft                     # Format ('agisoft' or 'meshroom')

# --- Output ---
output_folder: temp/output/                # Where depth maps/renders will be saved

# --- Options ---
distortion:
  enabled: true                            # Apply distortion to the depth maps so they match the original images captured
  max_iterations: 100                      # Maximum number of iterations before terminating
  tolerance: 0.001                         # Relative tolerance for convergence
  damping: 1.0                             # Damping factor when calculating distortion mappings. Helps with stability.
                                           # Smalller values will be more accurate but will require more iterations to converge.

scale_mesh:
  enabled: false                           # Rescale the mesh given known poses
  pose_1: filename_for_pose_1              # The id of the first pose along the mesh
  pose_2: filename_for_pose_2              # The id of the second pose along the mesh
  distance: 1.0                            # The true distance between the two poses in meters

manual_view:
  enabled: false                           # Set a manual view for the ray-tracing. Disables per-camera rendering.
  use_center: true                         # Place the reference frame at the center of the mesh. Otherwise, use the mesh's reference frame.
  position: [0, 0, 0]                      # A translation vector ([x, y, z]).
  orientation: [1, 0, 0, 0]                # A quaternion array ([w, x, y, z]).
  height: 3024                             # The resolution width of the image (pixels)
  width: 4032                              # The resolution height of the image (pixels)
  fx: 3277                                 # The focal length of the simulated camera in the x-axis (pixels)
  fy: 3277                                 # The focal length of the simulated camera in the y-axis (pixels)
