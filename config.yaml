# --- Input Files ---
mesh_path: temp/meshroom/mesh/texturedMesh.obj               # Accepts .obj, .ply, .stl
cameras_path: temp/meshroom/cameras.sfm          # Camera info file path
camera_format: meshroom                     # Format ('agisoft' or 'meshroom')
images_path: temp/meshroom/images         # Images folder path
extensions: [ png, jpg, jpeg ]             # Image formats available

# --- Output ---
output_folder: temp/meshroom/output/                     # Where depth maps/renders will be saved
save_scene: true                          # Set to true to save RGB renders (slower processing, memory intensive)

# --- Settings ---
distortion:
  enabled: true                            # Apply distortion to the depth maps so they match the original images captured
  max_iterations: 1000                     # Maximum number of iterations before terminating
  tolerance: 0.001                         # Relative tolerance for convergence
  damping: 1.0                             # Damping factor when calculating distortion mappings. Helps prevent
                                           # overflows but will increase computational time

perspective_correction:
  enabled: false                           # Calculate homography so that the depth maps are pixel-accurate
  model: similarity                        # The model type ('euclidean', 'similarity', 'affine', or 'projective')
  minimum_match_count: 4                   # Minimum matches needed for homography
  distance_ratio: 0.70                     # Ratio used for Lowe's ratio test when matching points.
  ransac_threshold: 5.0                    # RANSAC threshold for homography outliers
  max_iterations: 10000                    # Maximum number of iterations for RANSAC
  padding: 1000                            # The amount of padding (in pixels) around the borders.
                                           # Will be cropped to adjust for warping by homography

scale_mesh:
  enabled: false                           # Rescale the mesh given known poses
  pose_1: filename_for_pose_1              # The id of the first pose along the mesh
  pose_2: filename_for_pose_2              # The id of the second pose along the mesh
  distance: 1.0                            # The true distance between the two poses

manual_view:
  enabled: true                           # Set a manual view for the ray-tracing. Disables per-camera rendering.                          
  use_center: false                       # Place the reference frame at the center of the mesh. Otherwise, use the mesh's reference frame.
  position: [-0.79651805344083715, -2.3788752788892413, 1.3040029373426589]                      # A translation vector ([x, y, z]). Translation is applied from the center of the mesh.
  orientation: [0.40208939, 0.50337329, 0.50204577, 0.57696576]                # A quaternion array ([w, x, y, z]).
  # position: [0, 0, 0]                      # A translation vector ([x, y, z]).
  # orientation: [1, 0, 0, 0]                # A quaternion array ([w, x, y, z]).
  width: 4032                              # The resolution width of the image (pixels)
  height: 3024                             # The resolution height of the image (pixels)
  fx: 3277                                 # The focal length of the simulated camera in the x-axis (pixels)
  fy: 3277                                 # The focal length of the simulated camera in the y-axis (pixels)
